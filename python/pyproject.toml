[project]
name = "pdfglyph"
version = "1.0.0"
description = "Official Python client for the PDFGlyph API — render HTML and CSS to pixel-perfect PDFs with one API call."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["httpx>=0.24.0"]
license = { text = "MIT" }
authors = [{ name = "DTSaasLabs", email = "support@pdfglyph.com" }]
keywords = ["pdf", "html-to-pdf", "pdf-generation", "screenshot", "pdfglyph", "api", "sdk"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://pdfglyph.com"
Documentation = "https://pdfglyph.com/docs"
Repository = "https://github.com/DTSaasLabs/pdfglyph-clients"
Issues = "https://github.com/DTSaasLabs/pdfglyph-clients/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdfglyph"]

[tool.hatch.build.targets.sdist]
include = ["src/pdfglyph", "README.md", "LICENSE", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
