name: CI

# GitHub-hosted runners only. This repository is public, so a self-hosted
# runner would let a fork's pull request execute arbitrary code on our
# hardware.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    strategy:
      fail-fast: false
      matrix:
        # Floor and current, to keep the engines claim honest.
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          # defaults.run.working-directory does not apply to `uses`
          # steps, so point the action at the real package.json.
          package_json_file: node/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build

      - name: Verify both module systems load from the packed tarball
        run: |
          pnpm pack --pack-destination /tmp
          cd /tmp
          echo '{"name":"lt","version":"1.0.0"}' > package.json
          npm install ./pdfglyph-client-*.tgz --silent
          node -e 'const m=require("pdfglyph-client"); if(typeof m.PDFGlyph!=="function") process.exit(1)'
          node --input-type=module -e 'import {PDFGlyph} from "pdfglyph-client"; if(typeof PDFGlyph!=="function") process.exit(1)'

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    strategy:
      fail-fast: false
      matrix:
        # Floor and current, to keep the requires-python claim honest.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests -q

  # Single aggregate check so branch protection can require one name instead of
  # every matrix leg. Dependabot auto-merge waits on this.
  ci-ok:
    if: always()
    needs: [node, python]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all matrix jobs succeeded
        run: |
          echo "node:   ${{ needs.node.result }}"
          echo "python: ${{ needs.python.result }}"
          [ "${{ needs.node.result }}" = "success" ] || exit 1
          [ "${{ needs.python.result }}" = "success" ] || exit 1
