name: Release

# Tag-driven publishing, one tag prefix per package so the two clients
# version and ship independently:
#   client-node-v1.0.0    -> pdfglyph-client on npm
#   client-python-v1.0.0  -> pdfglyph on PyPI
on:
  push:
    tags:
      - "client-node-v*"
      - "client-python-v*"

permissions:
  contents: read

jobs:
  npm:
    if: startsWith(github.ref, 'refs/tags/client-node-v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm provenance attestation
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          # defaults.run.working-directory does not apply to `uses`
          # steps, so point the action at the real package.json.
          package_json_file: node/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          tag_version="${GITHUB_REF_NAME#client-node-v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag $tag_version does not match package.json $pkg_version" >&2
            exit 1
          fi

      # Publish with npm, not pnpm: setup-node writes an .npmrc and points
      # NPM_CONFIG_USERCONFIG at it, which npm honours on publish but pnpm
      # does not reliably (pnpm whoami authenticates, pnpm publish 404s).
      # prepublishOnly runs clean + build + test, so a failing test blocks release.
      - name: Publish to npm
        run: npm publish --access public --provenance --loglevel verbose
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    if: startsWith(github.ref, 'refs/tags/client-python-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify tag matches project version
        working-directory: python
        run: |
          tag_version="${GITHUB_REF_NAME#client-python-v}"
          pkg_version="$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag $tag_version does not match pyproject.toml $pkg_version" >&2
            exit 1
          fi

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Test before publishing
        working-directory: python
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest tests -q

      - name: Build distributions
        working-directory: python
        run: python -m build

      - name: Check metadata
        working-directory: python
        run: python -m twine check dist/*

      # Trusted publishing (OIDC) — no long-lived PyPI token is stored.
      # Requires a publisher configured on PyPI for this repo + workflow.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
