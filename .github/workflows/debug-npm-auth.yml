name: Debug npm auth

# Temporary diagnostic. Prints no secret values — `whoami` returns only a
# username, and `npm config list` redacts auth tokens.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: node/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Is the secret even present?
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "RESULT: NODE_AUTH_TOKEN is EMPTY — secret not visible to this job"
          else
            echo "RESULT: NODE_AUTH_TOKEN present, length ${#NODE_AUTH_TOKEN}"
            echo "RESULT: token prefix: ${NODE_AUTH_TOKEN%%_*}_"
          fi

      - name: What npmrc did setup-node write?
        run: |
          echo "USERCONFIG=$NPM_CONFIG_USERCONFIG"
          sed 's/=.*/=<redacted>/' "$NPM_CONFIG_USERCONFIG" || true

      - name: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "--- npm ---"
          npm whoami --registry https://registry.npmjs.org/ \
            && echo "RESULT: npm auth OK" \
            || echo "RESULT: npm auth FAILED"

      - name: pnpm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "--- pnpm ---"
          pnpm whoami --registry https://registry.npmjs.org/ \
            && echo "RESULT: pnpm auth OK" \
            || echo "RESULT: pnpm auth FAILED"

      - name: Can this token see the target name?
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm access list packages 2>&1 | head -20 || echo "RESULT: access list unavailable"
